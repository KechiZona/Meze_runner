buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

allprojects {
    version = '1.0.0'
    ext {
        appName = 'MazeRunner'
    }
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    sourceCompatibility = 17
    targetCompatibility = 17

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
